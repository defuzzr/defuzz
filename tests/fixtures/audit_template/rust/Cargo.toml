[workspace]
resolver = "3"
members = [
    "foundation",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
my-service-foundation = { path = "foundation" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8" }
