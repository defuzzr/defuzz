id: options-default-not-in-choices
name: Options Default Not In Choices Fixture
summary: Template fixture where default is not in choices.
kind: service
layout: mono
languages: [typescript]
placeholder: tmpl_prefix
substitute_in: ["**/*.ts", ".env.example"]
options:
  http_adapter:
    label: "HTTP adapter"
    choices: [hono, node_http]
    default: express
    env_key: TMPL_PREFIX_HTTP_ADAPTER
    description: "Both adapters ship; this picks the default wired in config."
repos:
  - name: tmpl_prefix
