# Run from the plugin folder: `pytest` (or `pytest tests`). The package uses relative
# imports, so tests import it by file location (importlib mode) with this folder on sys.path.
# Most tests need the Hermes Agent source on PYTHONPATH; see README "Running the tests".
[pytest]
testpaths = tests
addopts = --import-mode=importlib
pythonpath = .
consider_namespace_packages = true
