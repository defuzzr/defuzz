[project]
name = "tmpl-prefix-storage-memory"
version = "0.1.0"
description = "In-memory account repository adapter."
requires-python = ">=3.13"
dependencies = [
  "tmpl-prefix-accounts",
  "tmpl-prefix-core",
  # @xtask:dependencies
]

[tool.uv]
package = true

[tool.uv.sources]
tmpl-prefix-accounts = { workspace = true }
tmpl-prefix-core = { workspace = true }
# @xtask:sources

[build-system]
requires = ["uv_build>=0.6,<1"]
build-backend = "uv_build"
