---
name: CI

"on":
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMake, Ninja, and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18
          sudo update-alternatives --install /usr/bin/clang clang \
            /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ \
            /usr/bin/clang++-18 100

      - name: Install pinned clang-format and clang-tidy wheels
        run: |
          python -m pip install --upgrade pip
          pip install clang-format==23.1.5 clang-tidy==23.1.4

      - name: Verify pinned toolchain versions
        run: |
          cmake --version | grep -F "3.28.3"
          ninja --version | grep -Fx "1.11.1"
          clang --version | grep -F "18.1.3"
          clang++ --version | grep -F "18.1.3"
          clang-format --version | grep -F "23.1.5"
          clang-tidy --version | grep -F "23.1.4"

      - name: Run xtask ci
        run: cmake -P cmake/xtask.cmake -- ci
