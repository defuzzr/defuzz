---
name: CI

"on":
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run xtask ci
        run: cargo xtask ci

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace at MSRV
        # rust-toolchain.toml pins stable; +1.88 overrides it.
        # This ensures the MSRV is really tested.
        run: cargo +1.88 check --workspace --all-targets --locked
