---
name: CI

"on":
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install golangci-lint
        run: >-
          go install
          github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run xtask ci
        run: go run ./xtask ci
